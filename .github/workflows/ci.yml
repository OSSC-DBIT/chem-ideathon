name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for f in server.js src/*.js public/js/*.js scripts/*.mjs; do node --check "$f"; done
      - name: End to end API tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chem-ideathon:ci .
      - name: Check nginx config
        run: |
          docker run --rm --add-host app:127.0.0.1 \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:stable-alpine nginx -t
