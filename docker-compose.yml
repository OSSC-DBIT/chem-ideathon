services:
  app:
    build: .
    image: ossc/ideathon-26:latest
    restart: unless-stopped
    init: true
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      # Encrypts the database and the payment screenshots on disk. Losing it means losing the data.
      DATA_KEY: ${DATA_KEY:?Set DATA_KEY in the .env file (see .env.example)}
      DATA_KEY_OLD: ${DATA_KEY_OLD:-}
      UPI_ID: ${UPI_ID:-}
      UPI_NAME: ${UPI_NAME:-Ideathon 26}
      # Upload limits and virus scanning
      MAX_SCREENSHOT_MB: ${MAX_SCREENSHOT_MB:-3}
      MAX_STATEMENT_MB: ${MAX_STATEMENT_MB:-5}
      CLAMAV_HOST: clamav
      SCAN_REQUIRED: ${SCAN_REQUIRED:-false}
      # Outgoing email (verification codes and status emails). Leave SMTP_HOST empty to switch email off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-400}
      TRUST_PROXY: "1"
      TZ: Asia/Kolkata
    # When the mail server (or a cloudflared tunnel to it) runs on this machine, SMTP_ON_THIS_HOST is the
    # mail server's real name. The name then resolves to the Docker host, and TLS still checks the
    # certificate against the real name. Left empty, this line does nothing.
    extra_hosts:
      - "${SMTP_ON_THIS_HOST:-smtp-not-on-this-host.invalid}:host-gateway"
    volumes:
      - ideathon-data:/data
    expose:
      - "3000"
    networks:
      - internal
    # Hardening: read only filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Virus scanner. Reachable only from the app, on the internal network.
  # It downloads virus definitions on first start (a few minutes) and needs about 1.5 GB of RAM.
  clamav:
    image: clamav/clamav:stable@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - internal

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Published on localhost only: the Cloudflare tunnel on this machine connects here.
    # Set HOST_BIND=0.0.0.0 only if the site must be reachable directly from the network.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8094}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  internal:

volumes:
  ideathon-data:
  clamav-db:
