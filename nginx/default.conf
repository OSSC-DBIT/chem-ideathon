# Reverse proxy for the Ideathon '26 registration app.
# Only this container is published; the Node app is reachable on the internal network only.

# Per address limits. A whole campus Wi-Fi shares one public address, so on registration day
# hundreds of students arrive from the same one. The limits are sized for that; what really
# guards the form is the captcha, the email code and the per email limits in the app.
limit_req_zone $binary_remote_addr zone=api:10m      rate=150r/s;
limit_req_zone $binary_remote_addr zone=register:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=login:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=mailcode:10m rate=90r/m;
limit_req_status 429;

# If another proxy in front of this one terminates HTTPS, keep its protocol header.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # The app container gets a new address whenever it is recreated (an update, a changed setting).
    # Looking its name up through Docker's DNS for every few seconds, instead of once at start,
    # means nginx follows it by itself. Without this the site shows "back in a minute" until nginx
    # is restarted by hand.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app http://app:3000;

    # Screenshot uploads are resized in the browser; statements can be a few MB.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Behind the Cloudflare tunnel every request arrives from cloudflared on this machine, and
    # Cloudflare puts the visitor's address in CF-Connecting-IP. Use it, so rate limits apply per
    # visitor and not to the tunnel as a whole. The header is trusted only from local and private
    # addresses, which is why the port is published on 127.0.0.1 only (see docker-compose.yml).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;

    # Friendly errors. API calls get JSON (the pages show the message); page loads get HTML.
    error_page 413 = @too_large;
    error_page 429 = @too_many;
    error_page 502 503 504 = @page_down;

    location @too_large {
        default_type application/json;
        return 413 '{"error":"That upload is too large. Use a smaller image or file."}';
    }
    location @too_many {
        default_type application/json;
        add_header Retry-After 30 always;
        return 429 '{"error":"Too many requests from your network. Wait a minute and try again."}';
    }
    location @api_down {
        default_type application/json;
        return 503 '{"error":"The site is restarting. Try again in a minute."}';
    }
    location @page_down {
        default_type text/html;
        add_header Retry-After 30 always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Back in a minute</title><body style="font-family:system-ui,sans-serif;background:#fff6d8;color:#202124;text-align:center;padding:12vh 20px"><h1>Ideathon 26 will be back in a minute</h1><p>The site is restarting. Your registrations are safe. Please refresh shortly.</p></body></html>';
    }

    location = /api/admin/login {
        limit_req zone=login burst=5 nodelay;
        error_page 413 = @too_large;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        proxy_pass $app;
    }

    # Asking for a verification email: tighter per IP limit, on top of the app's per email limits.
    location = /api/verify/send {
        limit_req zone=mailcode burst=60 nodelay;
        error_page 413 = @too_large;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        proxy_pass $app;
    }

    location = /api/register {
        limit_req zone=register burst=80 nodelay;
        error_page 413 = @too_large;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        proxy_pass $app;
    }

    location /api/ {
        limit_req zone=api burst=300 nodelay;
        error_page 413 = @too_large;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        proxy_pass $app;
    }

    location / {
        proxy_pass $app;
    }

    # Hide dotfiles in case any are ever served.
    location ~ /\. {
        return 404;
    }
}
